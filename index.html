<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Rezeptsammlung</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf7f2; --warm: #f2ebe0; --parchment: #e8dfc8;
    --brown: #6b4c2a; --dark: #2c1a0e; --accent: #c4783a;
    --green: #5e7a42; --light: #f8f3ea; --border: #ddd0b8;
    --shadow: rgba(44,26,14,0.10); --text: #3d2810; --muted: #9e8060;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

  .site-header {
    background: var(--dark); padding: 0 48px; height: 68px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 200;
    box-shadow: 0 2px 24px rgba(0,0,0,0.25);
  }
  .site-logo { font-family: 'Lora', serif; font-size: 1.5rem; color: var(--parchment); text-decoration: none; }
  .site-logo em { color: var(--accent); font-style: italic; }
  .header-count { font-size: 0.82rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

  .hero {
    background: linear-gradient(160deg, #2c1a0e 0%, #5a3318 60%, #7a4a22 100%);
    padding: 64px 48px 52px; position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23ffffff' fill-opacity='0.025'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .hero-inner { position: relative; max-width: 720px; }
  .hero h1 { font-family: 'Lora', serif; font-size: clamp(2rem,5vw,3.2rem); color: var(--parchment); line-height: 1.2; margin-bottom: 12px; }
  .hero h1 em { color: var(--accent); }
  .hero p { color: #c8a878; font-size: 1.05rem; font-weight: 300; margin-bottom: 32px; }

  .search-wrap { position: relative; max-width: 560px; }
  .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  #searchInput {
    width: 100%; padding: 15px 18px 15px 48px;
    border: 1.5px solid rgba(255,255,255,0.15); border-radius: 50px;
    font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 600;
    background: rgba(255,255,255,0.12); color: white; outline: none;
  }
  #searchInput::placeholder { color: rgba(255,255,255,0.4); font-weight: 400; }
  #searchInput:focus { background: rgba(255,255,255,0.18); border-color: var(--accent); }
  .search-hint { font-size: 0.78rem; color: rgba(255,255,255,0.3); margin-top: 10px; padding-left: 4px; }

  .filter-section {
    background: var(--warm); border-bottom: 1px solid var(--border);
    padding: 16px 48px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .filter-label { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-right: 4px; }
  .filter-chip {
    padding: 6px 16px; border-radius: 50px; border: 1.5px solid var(--border);
    background: white; color: var(--brown); font-family: 'Nunito', sans-serif;
    font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.18s; white-space: nowrap;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
  .filter-chip.active { background: var(--accent); border-color: var(--accent); color: white; }

  .results-bar {
    padding: 14px 48px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); background: var(--light);
  }
  .results-count { font-size: 0.88rem; color: var(--muted); font-weight: 600; }
  .clear-btn { font-size: 0.82rem; color: var(--accent); background: none; border: none; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 700; display: none; }
  .clear-btn.visible { display: block; }

  .recipe-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 28px; padding: 40px 48px; max-width: 1600px; margin: 0 auto;
  }

  .recipe-card {
    background: white; border-radius: 18px; overflow: hidden;
    box-shadow: 0 2px 16px var(--shadow); cursor: pointer; text-decoration: none;
    color: inherit; transition: transform 0.22s cubic-bezier(.22,.68,0,1.2), box-shadow 0.22s;
    border: 1px solid var(--border); display: block;
  }
  .recipe-card:hover { transform: translateY(-6px); box-shadow: 0 16px 48px rgba(44,26,14,0.16); }

  .card-thumb {
    height: 190px; background: linear-gradient(135deg, var(--warm) 0%, var(--parchment) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 4.5rem; position: relative; overflow: hidden;
  }
  .card-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card-thumb-emoji { position: relative; z-index: 1; }

  .card-body { padding: 20px 22px 18px; }
  .card-cat { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 8px; }
  .card-title { font-family: 'Lora', serif; font-size: 1.15rem; line-height: 1.35; color: var(--dark); margin-bottom: 8px; font-weight: 600; }
  .card-desc { font-size: 0.84rem; color: var(--muted); line-height: 1.55; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
  .tag { padding: 3px 10px; border-radius: 50px; background: var(--warm); color: var(--brown); font-size: 0.72rem; font-weight: 700; border: 1px solid var(--border); }
  .tag.highlight { background: #fff3e0; border-color: var(--accent); color: var(--accent); }

  .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border); }
  .card-meta-item { font-size: 0.8rem; color: var(--muted); }
  .card-origin { font-size: 0.78rem; color: var(--brown); font-style: italic; }

  .empty-state { grid-column: 1/-1; text-align: center; padding: 80px 24px; color: var(--muted); }
  .empty-state .emoji { font-size: 4rem; display: block; margin-bottom: 16px; }
  .empty-state h3 { font-family: 'Lora', serif; font-size: 1.4rem; margin-bottom: 8px; color: var(--brown); }

  mark { background: rgba(196,120,58,0.2); color: inherit; border-radius: 2px; padding: 0 1px; }

  @media (max-width: 768px) {
    .site-header { padding: 0 20px; }
    .hero { padding: 40px 20px 36px; }
    .filter-section { padding: 14px 20px; }
    .results-bar { padding: 12px 20px; }
    .recipe-grid { padding: 24px 16px; gap: 16px; }
  }
</style>
</head>

<header class="site-header">
  <a href="index.html" class="site-logo">Meine <em>Rezepte</em></a>

</header>

    </div>

  </div>

<div class="filter-section">

<div class="results-bar">

let activeFilter = 'alle';
let searchQuery = '';

document.getElementById('headerCount').textContent = ALL_RECIPES.length + ' Rezepte';

function onSearch() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
  document.getElementById('clearBtn').classList.toggle('visible', searchQuery.length > 0);
  render();
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function clearSearch() {
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').classList.remove('visible');
  render();
}

function score(r, q) {
  if (!q) return { match: true, s: 0 };
  const fields = [
    [r.name.toLowerCase(), 10],
    [(r.tags||[]).join(' ').toLowerCase(), 8],
    [(r.ingredients||[]).map(i=>i.name).join(' ').toLowerCase(), 5],
    [(r.description||'').toLowerCase(), 3],
    [(r.origin||'').toLowerCase(), 4],
    [r.category.toLowerCase(), 6],
  ];
  let s = 0, match = false;
  for (const [val, w] of fields) { if (val.includes(q)) { s += w; match = true; } }
  return { match, s };
}

function hl(text, q) {
  if (!q || !text) return text;
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${esc})`, 'gi'), '<mark>$1</mark>');
}

function render() {
  const grid = document.getElementById('recipeGrid');
  let list = ALL_RECIPES;
  if (activeFilter !== 'alle') list = list.filter(r => r.category === activeFilter);

  let scored = list.map(r => ({ r, ...score(r, searchQuery) }));
  if (searchQuery) { scored = scored.filter(s => s.match); scored.sort((a,b) => b.s - a.s); }

  document.getElementById('resultsCount').textContent =
    scored.length === ALL_RECIPES.length
      ? ALL_RECIPES.length + ' Rezepte'
      : scored.length + ' von ' + ALL_RECIPES.length + ' Rezepten';

  if (!scored.length) {
    grid.innerHTML = `<div class="empty-state"><span class="emoji">🔍</span><h3>Kein Rezept gefunden</h3><p>Versuche einen anderen Suchbegriff.</p></div>`;
    return;
  }

  grid.innerHTML = scored.map(({r}) => {
    const photo = localStorage.getItem('photo_' + r.id);
    const imgHtml = photo ? `<img src="${photo}" alt="${r.name}" loading="lazy">` : '';
    const tagsHtml = (r.tags||[]).slice(0,4).map(t => {
      const hit = searchQuery && t.toLowerCase().includes(searchQuery);
      return `<span class="tag ${hit?'highlight':''}">${t}</span>`;
    }).join('');

    return `<a class="recipe-card" href="${r.id}.html">
      <div class="card-thumb">${imgHtml}<span class="card-thumb-emoji">${r.emoji||'🍽️'}</span></div>
      <div class="card-body">
        <div class="card-cat">${r.category}</div>
        <h2 class="card-title">${hl(r.name, searchQuery)}</h2>
        <p class="card-desc">${hl(r.description||'', searchQuery)}</p>
        ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
        <div class="card-footer">
          <span class="card-meta-item">⏱ ${r.time||'–'}</span>
          ${r.origin ? `<span class="card-origin">${r.origin}</span>` : ''}
        </div>
      </div>
    </a>`;
  }).join('');
}

render();
